name: RIMEForiOS
options:
  bundleIdPrefix: art.anjing.rimeios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "6.2"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # 版本号唯一来源：两个 target 的 Info.plist 引用 $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION)。
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "16"
packages:
  RimeEngine:
    path: Packages/RimeEngine
  KeyboardModels:
    path: Packages/KeyboardModels
  KeyboardUI:
    path: Packages/KeyboardUI
  RimeSync:
    path: Packages/RimeSync
targets:
  RIMEForiOS:
    type: application
    platform: iOS
    sources:
      - path: App
    preBuildScripts:
      - name: Copy SharedSupport
        # 先删除目标目录，避免增量构建嵌套出 SharedSupport/SharedSupport。
        script: rm -rf "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/SharedSupport" && cp -R "${SRCROOT}/Resources/SharedSupport" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/SharedSupport"
        basedOnDependencyAnalysis: false
        outputPaths:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/SharedSupport
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RIME for iOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.art.anjing.rimeios
    dependencies:
      - target: RIMEKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.anjing.rimeios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  RIMEKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: RIME for iOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardInputController
    entitlements:
      path: KeyboardExtension/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.art.anjing.rimeios
        com.apple.security.network.client: true
    dependencies:
      - package: RimeEngine
        product: RimeEngine
      - package: KeyboardModels
        product: KeyboardModels
      - package: KeyboardUI
        product: KeyboardUI
      - package: RimeSync
        product: RimeSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.anjing.rimeios.keyboard
  RIMECoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: KeyboardUI
        product: KeyboardUI
      - package: RimeEngine
        product: RimeEngine
      - package: KeyboardModels
        product: KeyboardModels
      - package: RimeSync
        product: RimeSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.anjing.rimeios.coretests
        GENERATE_INFOPLIST_FILE: true
schemes:
  RIMEForiOS:
    build:
      targets:
        RIMEForiOS: all
    run:
      config: Debug
      target: RIMEForiOS
    test:
      config: Debug
      targets:
        - name: RIMECoreTests
  RIMEKeyboard:
    build:
      targets:
        RIMEKeyboard: all
        RIMEForiOS: all
    run:
      config: Debug
      target: RIMEForiOS
    test:
      config: Debug
      targets:
        - name: RIMECoreTests
