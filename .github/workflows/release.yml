name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify bundled dependencies
        run: ./scripts/verify-dependencies.sh --binaries

      - name: Build unsigned device app
        run: |
          xcodebuild -project RIMEForiOS.xcodeproj -scheme RIMEForiOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned ipa
        run: |
          ./scripts/package-ipa.sh build/dd/Build/Products/Release-iphoneos/RIMEForiOS.app \
            "stage/RIME-for-iOS-${GITHUB_REF_NAME#v}-unsigned.ipa"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RIME for iOS ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            stage/RIME-for-iOS-${GITHUB_REF_NAME#v}-unsigned.ipa
