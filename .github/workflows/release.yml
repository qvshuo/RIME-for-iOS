name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          latest="$(ls /Applications | grep '^Xcode' | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "/Applications/$latest"

      - name: Verify bundled dependencies
        run: ./scripts/verify-dependencies.sh --binaries

      - name: Build unsigned device app
        run: |
          xcodebuild -project RIMEForiOS.xcodeproj -scheme RIMEForiOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned ipa
        run: |
          ./scripts/package-ipa.sh build/dd/Build/Products/Release-iphoneos/RIMEForiOS.app \
            "stage/RIME-for-iOS-${GITHUB_REF_NAME#v}-unsigned.ipa"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "RIME for iOS ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            stage/RIME-for-iOS-${GITHUB_REF_NAME#v}-unsigned.ipa
